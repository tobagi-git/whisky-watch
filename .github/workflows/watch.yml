name: whisky-watch

on:
  schedule:
    # 주 트리거는 Cloudflare Worker(worker/, 매분 판단 → 정해진 시각·텔레그램 메시지 시 dispatch).
    # GitHub 예약 실행은 대부분 버려져서(2026-09-19~22 실측 하루 3~6회) Worker가 죽었을 때를 대비한 예비로만 둔다.
    - cron: "37 */6 * * *"        # 6시간마다 (KST 03:37 09:37 15:37 21:37 근처, 늦거나 빠질 수 있음)
  workflow_dispatch:
    inputs:
      test_email:
        description: "폴링 대신 테스트 메일만 보내기"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: whisky-watch
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul
      WHISKY_DATA_DIR: ${{ github.workspace }}/data
      WHISKY_WATCHLIST: ${{ github.workspace }}/watchlist.json
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Send test email
        if: ${{ inputs.test_email }}
        run: python whisky_watch.py --test-email

      - name: Poll shops
        if: ${{ !inputs.test_email }}
        run: python whisky_watch.py --force

      - name: Track wanted bottles (Notion + Telegram)
        if: ${{ !inputs.test_email }}
        run: python bottle_tracker.py

      - name: Watch Yahoo Auctions (Telegram)
        if: ${{ !inputs.test_email }}
        run: python yahoo_watch.py

      - name: Save state
        run: |
          # 로그는 최근 3000줄만 유지
          if [ -f data/watch.log ]; then tail -n 3000 data/watch.log > data/watch.log.tmp && mv data/watch.log.tmp data/watch.log; fi
          git config user.name "whisky-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "state: $(date '+%Y-%m-%d %H:%M') KST"
          git pull --rebase
          git push
