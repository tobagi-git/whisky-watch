name: whisky-watch

on:
  schedule:
    # 주 트리거는 Cloudflare Worker(worker/, 매분 판단 → 정해진 시각·텔레그램 메시지 시 dispatch).
    # GitHub 예약 실행은 대부분 버려져서(2026-09-19~22 실측 하루 3~6회) Worker가 죽었을 때를 대비한 예비로만 둔다.
    - cron: "37 */6 * * *"        # 6시간마다 (KST 03:37 09:37 15:37 21:37 근처, 늦거나 빠질 수 있음)
  workflow_dispatch:
    inputs:
      test_email:
        description: "폴링 대신 테스트 메일만 보내기"
        type: boolean
        default: false
      test_kakao:
        description: "폴링 대신 카카오톡 테스트 메시지만 보내기"
        type: boolean
        default: false
      deep:
        description: "정밀 스캔(카탈로그 전체 — 오래된 상품 재입고까지). Worker가 07:55·18:55에 켠다"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: whisky-watch
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul
      WHISKY_DATA_DIR: ${{ github.workspace }}/data
      WHISKY_WATCHLIST: ${{ github.workspace }}/watchlist.json
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}   # 공개 저장소라 채팅 ID는 시크릿에만(상태 파일엔 "@chat")
      KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      KAKAO_TOKEN_KEY: ${{ secrets.KAKAO_TOKEN_KEY }}
    steps:
      - uses: actions/checkout@v7

      # 상태 파일(seen.json 등 ~11MB)은 커밋 1개짜리 state 브랜치에 산다(2026-10-08, main 비대화 방지).
      # 못 받아오면 중단 — 빈 상태로 돌면 전 항목을 "신규"로 재알림하게 된다.
      - name: Restore state (state 브랜치)
        run: |
          git clone -q --depth 1 -b state "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$RUNNER_TEMP/state" \
            || { echo "::error::state 브랜치를 받지 못함 — 빈 상태로 실행하지 않음"; exit 1; }
          mkdir -p data && rsync -a --exclude .git "$RUNNER_TEMP/state/" data/

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Send test Kakao
        if: ${{ inputs.test_kakao }}
        run: python whisky_watch.py --test-kakao

      - name: Send test email
        if: ${{ inputs.test_email }}
        run: python whisky_watch.py --test-email

      - name: Poll shops
        if: ${{ !inputs.test_email && !inputs.test_kakao }}
        run: python whisky_watch.py --force ${{ inputs.deep && '--deep' || '' }}

      - name: Track wanted bottles (Notion + Telegram)
        if: ${{ !inputs.test_email && !inputs.test_kakao }}
        run: python bottle_tracker.py

      - name: Watch auctions & UK shops (Telegram)
        if: ${{ !inputs.test_email && !inputs.test_kakao }}
        run: python auction_watch.py

      - name: Shop report 08·19시 (위스키 신제품·재입고, Telegram + mail)
        if: ${{ !inputs.test_email && !inputs.test_kakao }}
        run: python shop_digest.py --auto

      - name: Save state
        run: |
          # 로그는 최근 3000줄만 유지
          if [ -f data/watch.log ]; then tail -n 3000 data/watch.log > data/watch.log.tmp && mv data/watch.log.tmp data/watch.log; fi
          # ① 큰 상태 파일 → state 브랜치 (항상 커밋 1개, 강제 푸시)
          rsync -a --delete --exclude .git --exclude inbox.md data/ "$RUNNER_TEMP/state/"
          cd "$RUNNER_TEMP/state"
          git config user.name "whisky-watch-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan state-new && git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "state: $(date '+%Y-%m-%d %H:%M') KST"
            for i in 1 2 3 4; do git push -q --force origin HEAD:state && break; echo "state push 실패 ($i회차)"; sleep $((i * 10)); done
          fi
          cd "$GITHUB_WORKSPACE"
          # ② inbox.md만 main에 (주간 루틴이 읽고 비운다)
          git config user.name "whisky-watch-bot"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/inbox.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "inbox: $(date '+%Y-%m-%d %H:%M') KST"
          for i in 1 2 3 4; do git pull -q --rebase && git push -q && exit 0; echo "push 실패 ($i회차) — 재시도"; sleep $((i * 10)); done
          echo "::warning::inbox push 실패 — 다음 실행에서 다시 기록된다"
          exit 0
